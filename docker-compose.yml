services:
  sqa-control:
    build: .
    image: scanner-and-qa:latest
    container_name: scanner-and-qa
    ports:
      - "${SQA_PORT:-8501}:8501"
    volumes:
      - ./data:/srv/data
      - ./runs:/srv/runs
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-}
    restart: unless-stopped
