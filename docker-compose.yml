services:
  sqa-control:
    build: .
    image: scanner-and-qa:latest
    container_name: scanner-and-qa
    # 用 host 网络以便直接访问局域网里的主机 B 和 LLM 端点
    network_mode: host
    volumes:
      - ./data:/srv/data
      - ./runs:/srv/runs
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-}
    restart: unless-stopped
